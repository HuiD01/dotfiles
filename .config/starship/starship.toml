"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
[▓░](fg:#5E81AC bg:#D8DEE9)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$golang\
$php\
$status\
$time\
[░▓](fg:#5E81AC bg:#D8DEE9)\
\n$character"""

[directory]
style = "fg:#ECEFF4 bg:#4C566A"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#4C566A"
format = '[[ $symbol $branch ](fg:#ECEFF4 bg:#4C566A)]($style)'

[git_status]
style = "bg:#4C566A"
format = '[[($all_status$ahead_behind )](fg:#ECEFF4 bg:#4C566A)]($style)'

[nodejs]
symbol = ""
style = "bg:#434C5E"
format = '[[ $symbol ($version) ](fg:#ECEFF4 bg:#434C5E)]($style)'

[bun]
symbol = ""
style = "bg:#434C5E"
format = '[[ $symbol ($version) ](fg:#ECEFF4 bg:#434C5E)]($style)'

[rust]
symbol = ""
style = "bg:#434C5E"
format = '[[ $symbol ($version) ](fg:#ECEFF4 bg:#434C5E)]($style)'

[golang]
symbol = ""
style = "bg:#434C5E"
format = '[[ $symbol ($version) ](fg:#ECEFF4 bg:#434C5E)]($style)'

[php]
symbol = ""
style = "bg:#434C5E"
format = '[[ $symbol ($version) ](fg:#ECEFF4 bg:#434C5E)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#D8DEE9"
format = '[[ $time ](fg:#2E3440 bg:#D8DEE9)]($style)'

[os]
style = "bg:#D8DEE9 fg:#2E3440"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[character]
success_symbol = "[>](bold #88C0D0)"
error_symbol = "[>](bold #BF616A)"
vimcmd_symbol = "[<](bold #B48EAD)"
vimcmd_visual_symbol = "[<](bold #EBCB8B)"
vimcmd_replace_symbol = "[<](bold #BF616A)"

[username]
show_always = true
style_user = "bg:#D8DEE9 fg:#2E3440"
style_root = "bg:#BF616A fg:#ECEFF4"
format = "[ $user ]($style)"

[status]
disabled = false
symbol = "✘"
style = "bg:#434C5E"
format = '[[ $symbol $status ](fg:#BF616A bg:#434C5E)]($style)'
