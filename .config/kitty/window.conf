# Window canvas

window_padding_width 26 1 30 1

# Keep native shadow/corners and edge resizing while hiding the titlebar.
hide_window_decorations titlebar-only
macos_window_resizable yes

# Split borders: shown only when more than one pane is visible.
window_border_width    1px
active_border_color    #58a6ff
inactive_border_color  #21262d
draw_minimal_borders   yes
