# Tab navigation
map cmd+[ previous_tab
map cmd+] next_tab

# Jump directly to tabs 1–9.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Sessions
map cmd+shift+s save_as_session --base-dir ~/.local/share/kitty/sessions --os-window-geometry
map cmd+shift+o goto_session ~/.local/share/kitty/sessions

# Save the current state before a normal Kitty quit and load it on next start.
map cmd+q combine : save_as_session --save-only --os-window-geometry /Users/hui/.local/share/kitty/sessions/last.kitty-session : quit
