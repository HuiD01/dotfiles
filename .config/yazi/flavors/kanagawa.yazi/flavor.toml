# ============================================================
#  Kanagawa — 原始配色 (kanagawa.nvim 风格)
#  来源: https://github.com/rebelot/kanagawa.nvim
# ============================================================

# 调色板
# ---
# sumiInk0      "#16161d" → bg     (最深背景)
# sumiInk3      "#1f1f28" → bg-2   (次深背景)
# sumiInk4      "#2a2a37" → ui     (UI 背景)
# sumiInk6      "#54546d" → tx-3   (弱文字)
# fujiWhite     "#dcd7ba" → tx     (主文字)
# oldWhite      "#c8c093"          (暗文字)
# fujiGray      "#727169" → tx-2   (中等文字)
# peachRed      "#ff5d62" → re     (红色)
# autumnRed     "#c34043"          (深红)
# crystalBlue   "#7e9cd8" → bl     (蓝色)
# waveRed       "#e46876" → pu-2   (品红)
# carpYellow    "#e6c384" → ye     (黄色)
# springGreen   "#98bb6c" → gr     (绿色)
# autumnGreen   "#76946a" → gr-2   (深绿)
# oniViolet     "#957fb8" → pu     (紫色)
# waveAqua1     "#6a9589"          (深青)
# surimiOrange  "#ffa066" → or     (橙色)
# waveAqua2     "#7aa89f" → cy     (青色)

# ═══════════════════════════════════════════════════════════
#  ⚠️ kanagawa 是精简 flavor, 缺少以下区域:
#    [app] 背景 / [confirm] 确认弹窗 / [spot] 文件信息表
#    [icon] 图标全缺 / [indicator] padding
#    如需完整 UI, 请在 theme.toml 中补充这些 section
# ═══════════════════════════════════════════════════════════

# ── 文件管理器 ────────────────────────────────────────────
[mgr]
# 文件标记
marker_copied   = { fg = "#98bb6c", bg = "#98bb6c" }  # 复制 (绿)
marker_cut      = { fg = "#e46876", bg = "#e46876" }  # 剪切 (品红)
marker_marked   = { fg = "#957fb8", bg = "#957fb8" }  # 选中 (紫)
marker_selected = { fg = "#ffa066", bg = "#ffa066" }  # 光标行 (橙)

# 当前路径
cwd = { fg = "#e6c384" }  # 黄色

# 查找
find_keyword  = { fg = "#ffa066", bg = "#1f1f28" }  # 匹配关键字
find_position = {}                                    # 当前位置

# 标记计数
count_copied   = { fg = "#1f1f28", bg = "#98bb6c" }  # 复制计数
count_cut      = { fg = "#1f1f28", bg = "#e46876" }  # 剪切计数
count_selected = { fg = "#1f1f28", bg = "#ffa066" }  # 选中计数

# 面板分隔线
border_symbol = "│"
border_style  = { fg = "#dcd7ba" }  # 分隔线颜色

# ── 指示器 (反色选中风格) ────────────────────────────────
[indicator]
parent  = { reversed = true }   # 上级目录闪烁
current = { reversed = true }   # 当前选中行 (反色)
preview = { reversed = true }   # 预览范围
# ⚠️ 未设 padding, 选中条默认有圆弧边角

# ── 标签栏 ────────────────────────────────────────────────
[tabs]
active   = { fg = "#1f1f28", bg = "#7e9cd8" }  # 当前标签 (蓝底)
inactive = { fg = "#7e9cd8", bg = "#2a2a37" }  # 非激活标签
sep_inner = { open = "", close = "" }            # 标签间分隔
sep_outer = { open = "", close = "" }            # 标签两侧分隔

# ── 模式栏 ────────────────────────────────────────────────
[mode]
# Normal 模式
normal_main = { fg = "#1f1f28", bg = "#7e9cd8" }
normal_alt  = { fg = "#7e9cd8", bg = "#2a2a37" }
# Select 模式
select_main = { fg = "#1f1f28", bg = "#957fb8" }
select_alt  = { fg = "#957fb8", bg = "#2a2a37" }
# Unset 模式
unset_main  = { fg = "#1f1f28", bg = "#e6c384" }
unset_alt   = { fg = "#e6c384", bg = "#2a2a37" }

# ── 状态栏 ────────────────────────────────────────────────
[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall   = { fg = "#c8c093", bg = "#16161d" }  # 状态栏整体

progress_label  = { fg = "#7e9cd8", bold = true }            # 进度标签
progress_normal = { fg = "#2a2a37", bg = "#1f1f28" }         # 正常进度
progress_error  = { fg = "#2a2a37", bg = "#1f1f28" }         # 失败进度

# 权限字符 (rwx)
perm_type  = { fg = "#98bb6c" }   # 类型字符
perm_read  = { fg = "#e6c384" }   # r
perm_write = { fg = "#ff5d62" }   # w
perm_exec  = { fg = "#7aa89f" }   # x
perm_sep   = { fg = "#957fb8" }   # 分隔符

# ⚠️ [confirm] 确认弹窗 → 未设置, 使用 Yazi 默认

# ── 选择器 ────────────────────────────────────────────────
[pick]
border   = { fg = "#7fb4ca" }
active   = { fg = "#957fb8", bold = true }
inactive = {}

# ── 输入框 ────────────────────────────────────────────────
[input]
border   = { fg = "#7fb4ca" }
title    = {}
value    = {}
selected = { reversed = true }

# ── 命令补全 (旧名 completion, 新版叫 cmp) ──────────────
[completion]
border   = { fg = "#7fb4ca" }
active   = { reversed = true }
inactive = {}

# ⚠️ [spot] 文件信息表 → 未设置, 使用 Yazi 默认

# ── 任务管理器 ────────────────────────────────────────────
[tasks]
border  = { fg = "#7fb4ca" }
title   = {}
hovered = { fg = "#957fb8" }

# ── 快捷键面板 ────────────────────────────────────────────
[which]
cols           = 2
separator      = " - "
separator_style = { fg = "#727169" }
mask  = { bg = "#16161d" }
rest  = { fg = "#727169" }
cand  = { fg = "#7e9cd8" }
desc  = { fg = "#54546d" }

# ── 帮助面板 ──────────────────────────────────────────────
[help]
on      = { fg = "#7aa89f" }
run     = { fg = "#957fb8" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#1f1f28", bg = "#dcd7ba" }

# ── 通知条 ────────────────────────────────────────────────
[notify]
title_info  = { fg = "#98bb6c" }   # 信息
title_warn  = { fg = "#e6c384" }   # 警告
title_error = { fg = "#ff5d62" }   # 错误

# ⚠️ [icon] 图标 → 未设置, 使用 Yazi 默认

# ── 文件文字颜色 ──────────────────────────────────────────
[filetype]
rules = [
    # 图片
    { mime = "image/*", fg = "#e6c384" },
    # 音视频
    { mime = "{audio,video}/*", fg = "#957fb8" },
    # 压缩包
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e46876" },
    # 文档
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#6a9589" },
    # 断链/孤儿
    { url = "*", is = "orphan", fg = "#c34043" },
    # 可执行文件
    { url = "*", is = "exec", fg = "#76946a" },
    # 兜底
    { url = "*",  fg = "#dcd7ba" },   # 普通文件
    { url = "*/", fg = "#7e9cd8" },   # 目录 (蓝)
]
