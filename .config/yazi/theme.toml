# : Manager [[[

[mgr]
cwd = { fg = "#f2f5f8" }

# Find
find_keyword  = { fg = "#e6c5cc", bold = true, italic = true, underline = true }
find_position = { fg = "#e6c5cc", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#a3c4de", bg = "#a3c4de" }
marker_cut      = { fg = "#e4eaf2", bg = "#e4eaf2" }
marker_marked   = { fg = "#e6c5cc", bg = "#e6c5cc" }
marker_selected = { fg = "#d6e2f0", bg = "#d6e2f0" }

# Count
count_copied   = { fg = "#2d3d4e", bg = "#e4eaf2" }
count_cut      = { fg = "#2d3d4e", bg = "#e4eaf2" }
count_selected = { fg = "#3d5270", bg = "#d6e2f0" }

# Border
border_symbol = " "
border_style  = { fg = "#b8cde0" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }
preview = { bg = "#455568", underline = false }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#b8cde0", bold = true, bg = "#181818" }
inactive  = { fg = "#ccdae8", bg = "#181818" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#b8cde0", fg = "#2d3d4e", bold = true }
normal_alt  = { bg = "#556878", fg = "#d5dde5" }

# Select mode
select_main = { bg = "#ccdae8", fg = "#2d3d4e", bold = true }
select_alt  = { bg = "#556878", fg = "#d5dde5" }

# Unset mode
unset_main = { bg = "#d6e2f0", fg = "#3d4d60", bold = true }
unset_alt  = { bg = "#556878", fg = "#d5dde5" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "█", close = " " }
sep_right = { open = " ", close = "█" }

# Permissions
perm_type  = { fg = "#80a8c4" }
perm_write = { fg = "#b898a0" }
perm_read  = { fg = "#e06060" }
perm_exec  = { fg = "#90b8d4" }
perm_sep   = { fg = "#70a0c0" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#b8cde0", bg = "#455568" }
progress_error  = { fg = "#e6c5cc", bg = "#455568" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#455568" }
cand = { fg = "#b8cde0" }
rest = { fg = "#3d5270" }
desc = { fg = "#f2f5f8" }
separator = " ▶ "
separator_style = { fg = "#f2f5f8" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#d6e2f0" }
title_warn  = { fg = "#b8cde0" }
title_error = { fg = "#e6c5cc" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#b8cde0" }
active = { fg = "#d6e2f0", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#b8cde0" }
value  = { fg = "#f2f5f8" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#b8cde0", bg = "#3d5270" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#b8cde0" }
title   = {}
hovered = { fg = "#e4eaf2", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#f2f5f8" }
run    = { fg = "#f2f5f8" }
footer = { fg = "#2d3d4e", bg = "#ccdae8" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#95ccc4" },

    # Media
    { mime = "{audio,video}/*", fg = "#ebe0c0" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d6e2ee" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#b7d8b7" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#e4eaf2" },

    # Fallback
    { url = "*", fg = "#f2f5f8" },
    { url = "*/", fg = "#b8cde0" },
]


# : ]]]
# : Icon [[[

[icon]
# ==========================================
# 1. 预设条件 (最高优先级)
# ==========================================
prepend_conds = [
    # 隐藏的文件夹
    { if = "dir & hidden", text = "󰉋", fg = "#ffffff" },

    # 普通文件夹
    { if = "dir", text = "󰉋", fg = "#b8cde0" },

    # 损坏的符号链接 (孤儿)
    { if = "orphan", text = "󰌌", fg = "#e6c5cc" },
    # 正常的符号链接
    { if = "link", text = "󰌷", fg = "#e4eaf2" },

    # 可执行文件
    { if = "exec & !dir", text = "󰆧", fg = "#ccdae8" },

    # 普通隐藏文件
    { if = "hidden", text = "󰈙", fg = "#9aa6b2" },
]

# ==========================================
# 2. 预设目录 (特殊文件夹图标与主色调)
