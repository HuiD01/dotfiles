# ~/.config/tmux/tmux.conf
# 分层原则：AeroSpace 占 Alt、Ghostty 占 Cmd、tmux 占 Ctrl-a。互不抢键。

# ═══ 1. 前缀键：Ctrl-b → Ctrl-a（AeroSpace 零 ctrl 绑定，安全）═══
set -g prefix C-a
bind C-a send-prefix          # Ctrl-a Ctrl-a = 真给内层程序发 Ctrl-a（行首键，必须留）
unbind C-b                    # 把 Ctrl-b 还给 fish

# ═══ 2. 鼠标：点着切面板、拖边框调大小、滚轮翻历史 ═══
set -g mouse on

# ═══ 3. 编号从 1 开始，与 Alt+1..9 切工作区形成对称 ═══
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ═══ 4. 体验 ═══
set -g history-limit 50000    # 默认 2000 太少
set -g escape-time 10         # vim 用户必改：Esc 不再有延迟（默认 500ms）
set -g focus-events on        # 切回面板时通知 vim 重绘
setw -g mode-keys vi          # 复制模式用 vi 键位
set -g set-clipboard on       # 默认 external —— 不改的话 tmux 自己复制进不了系统剪贴板

# ═══ 5. 分屏（配合 Ghostty 的 Cmd+D / Cmd+Shift+D 桥接）═══
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ═══ 6. 面板导航（配合 Cmd+Alt+方向 桥接）═══
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ═══ 7. 面板大小（配合 Cmd+Ctrl+方向 桥接，注意是大写）═══
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ═══ 8. 新窗口沿用当前目录（默认是家目录，项目里特别烦）═══
bind c new-window -c "#{pane_current_path}"

# ═══ 9. 找回被 h/j/k/l 占掉的默认键 ═══
# 第 6/7 节覆盖了 tmux 默认的 Ctrl-a l = 上个窗口、Ctrl-a L = 上个会话
bind q last-window

# ═══ 10. 复制粘贴 → 系统剪贴板 ═══
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ═══ 11. 重载配置 ═══
bind r source-file /Users/hui/.config/tmux/tmux.conf \; display-message "配置已重载"

# ═══ 12. Ctrl-a ? 中文速查菜单（鼠标可点，零外部依赖）═══
# ⚠️ 踩过的坑：display-menu 每一项是「名字 / 键 / 命令」三个参数，
#    命令里只要含空格，就必须整体用引号包成【一个】参数，
#    否则三元组全部错位，整条命令报 "not enough arguments" 而静默失败 —— 屏幕毫无反应。
bind ? display-menu -x C -y C -T "  tmux 速查（点我 / 按字母）  " \
  "新窗口            c"     c   "new-window -c '#{pane_current_path}'" \
  "竖切面板          |"     "|" "split-window -h -c '#{pane_current_path}'" \
  "横切面板          -"     "-" "split-window -v -c '#{pane_current_path}'" \
  "" \
  "切面板 ←          h"     h   "select-pane -L" \
  "切面板 ↓          j"     j   "select-pane -D" \
  "切面板 ↑          k"     k   "select-pane -U" \
  "切面板 →          l"     l   "select-pane -R" \
  "下一个面板        o"     o   "select-pane -t :.+" \
  "" \
  "最大化 / 还原     z"     z   "resize-pane -Z" \
  "关面板            x"     x   "kill-pane" \
  "关窗口            &"     "&" "kill-window" \
  "" \
  "Detach（挂起）    d"     d   "detach-client" \
  "复制模式          ["     "[" "copy-mode" \
  "全部键位          :"     ":" "command-prompt" \
  "重载配置          r"     r   "source-file /Users/hui/.config/tmux/tmux.conf"

# ═══ 13. 全量键位搜索（fzf）═══
bind / display-popup -E -w 90% -h 80% "tmux list-keys | fzf --reverse --no-sort"

# ═══ 14. 字母键备用入口 ═══
# 与 Ctrl-a ? 完全相同的菜单，绑在字母键上（输入法/键盘布局出问题时可用）
bind m display-menu -x C -y C -T "  tmux 速查（点我 / 按字母）  " \
  "新窗口            c"     c   "new-window -c '#{pane_current_path}'" \
  "竖切面板          |"     "|" "split-window -h -c '#{pane_current_path}'" \
  "横切面板          -"     "-" "split-window -v -c '#{pane_current_path}'" \
  "" \
  "切面板 ←          h"     h   "select-pane -L" \
  "切面板 ↓          j"     j   "select-pane -D" \
  "切面板 ↑          k"     k   "select-pane -U" \
  "切面板 →          l"     l   "select-pane -R" \
  "下一个面板        o"     o   "select-pane -t :.+" \
  "" \
  "最大化 / 还原     z"     z   "resize-pane -Z" \
  "关面板            x"     x   "kill-pane" \
  "关窗口            &"     "&" "kill-window" \
  "" \
  "Detach（挂起）    d"     d   "detach-client" \
  "复制模式          ["     "[" "copy-mode" \
  "全部键位          :"     ":" "command-prompt" \
  "重载配置          r"     r   "source-file /Users/hui/.config/tmux/tmux.conf"

# ═══ 15. 输入法指示灯（中/英一眼可辨）═══
# 解决「在终端里不知道现在是中文还是英文输入」：右端常驻显示当前输入源。
#   🟢 英ABC                当前是英文键盘布局，敲 :wq 安全
#   🟡 中Metasequoia · ZH   当前是水杉输入法，敲 : 会变全角 ：
#
# 实现：~/.local/bin/ime-status 输出带颜色标记的短串，由 imectl 读取系统输入源。
# 换输入法不用改这里 —— imectl 读的是系统输入源，会自动认出新输入法。
# ⚠️ 踩过的坑 1：#() 里必须写【绝对路径】，tmux 会自己展开 $HOME（它环境里可能为空），
#    写成 #($HOME/...) 会变成 #(/bin/...) 而静默失败。
# ⚠️ 踩过的坑 2：不能用 #{T:status-right} 来验证效果 —— 它【不会执行】命令替换，
#    看起来像没生效。要验证就盯屏幕，或给脚本临时加日志看有没有被调用。
# ⚠️ 踩过的坑 3：status-right-length 默认 40 会把指示灯挤掉，必须调大。
set -g status-right '#(/Users/hui/.local/bin/ime-status) "#{=21:pane_title}" %H:%M'
set -g status-right-length 200

# 轮询间隔：默认 15 秒太钝，切完输入法要等太久才刷新。
# 本机实测 ime-status 单次约 93ms，2 秒一次的开销可忽略。
set -g status-interval 2

# ═══ 16. 输入法变化时立即唤醒状态栏（事件驱动）═══
# 问题：tmux 的状态栏命令 #() 只在客户端「有活动」时才重跑，一旦空闲就冻结缓存值。
#       结果就是切完输入法必须再敲一个键，指示灯才更新 —— 很鸡肋。
#       （不是 status-interval 的问题，它一直在按 2 秒跑；是重绘触发条件的问题。）
# 解法：input-source-watch 监听 macOS 的分布式通知
#         AppleSelectedInputSourcesChangedNotification
#         com.apple.Carbon.TISNotifySelectedKeyboardInputSourceChanged
#       输入源一变就执行 tmux-refresh（即 tmux refresh-client -S）逼 tmux 重绘。
#       事件驱动：空闲时零开销，切换时零延迟，比轮询省 CPU。
#
# 为什么不用 launchd：本机文件沙盒会挡掉 launchctl（bootstrap 报 I/O error）。
#   挂在 tmux 自启也更贴切 —— 指示灯本来就只在 tmux 里有意义。
#
# ⚠️ 三个坑（详见 ~/.local/bin/watch-ensure 和 ~/.local/src/imectl/*.c 的注释）：
#   1. 判断「是否已在运行」不能用 pgrep —— tmux 为执行 run-shell 起的那个 shell
#      命令行里就含脚本名，pgrep 会匹配到它自己，误判为「已在运行」而不启动。
#      改用 PID 文件（input-source-watch --pidfile）才可靠。
#   2. 必须用 detach 而不是 `nohup cmd &` —— tmux 在 run-shell 退出时会清理
#      【整个进程组】，nohup 只挡 SIGHUP，挡不住进程组清理。
#   3. 脚本权限要 755。若是 711（只有执行没有读），/bin/sh 读不到脚本内容会静默失败。
#
# 查看状态：watch-ensure status      停掉：watch-ensure stop
run-shell -b "/Users/hui/.local/bin/watch-ensure"
